---
- name: Deploy Node.js application
  hosts: webservers
  become: yes

  vars:
    app_dir: /home/ec2-user/Deploy
    repo_url: https://github.com/jsjKarthik/Deploy.git

  tasks:
    - name: Install Git
      dnf:
        name: git
        state: present

    - name: Install Node.js
      dnf:
        name: nodejs
        state: present

    - name: Install Nginx
      dnf:
        name: nginx
        state: present

    - name: Clone or update application
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: yes
      become_user: ec2-user

    - name: Install Node.js dependencies
      npm:
        path: "{{ app_dir }}"

    - name: Create Node.js systemd service
      copy:
        dest: /etc/systemd/system/nodeapp.service
        content: |
          [Unit]
          Description=Node.js Application
          After=network.target

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory={{ app_dir }}
          ExecStart=/usr/bin/node {{ app_dir }}/app.js
          Restart=always
          RestartSec=5
          Environment=NODE_ENV=production
          Environment=PORT=3000

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable and restart Node.js application
      systemd:
        name: nodeapp
        enabled: yes
        state: restarted

    - name: Configure Nginx reverse proxy
      copy:
        dest: /etc/nginx/conf.d/nodeapp.conf
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Test Nginx configuration
      command: nginx -t
      changed_when: false

    - name: Enable and restart Nginx
      systemd:
        name: nginx
        enabled: yes
        state: restarted