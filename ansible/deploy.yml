---
- name: Deploy Node.js Application
  hosts: webservers
  become: true

  vars:
    app_directory: /var/www/nodejs-app
    app_name: nodejs-app

  tasks:

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - nodejs
          - npm
          - nginx
        state: present

    - name: Install PM2
      community.general.npm:
        name: pm2
        global: true

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_directory }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"

    - name: Copy application
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../"
        dest: "{{ app_directory }}/"
        owner: ec2-user
        group: ec2-user
      notify: Restart application

    - name: Install Node.js dependencies
      ansible.builtin.command:
        cmd: npm ci --omit=dev
        chdir: "{{ app_directory }}"
      become_user: ec2-user
      changed_when: true

    - name: Check PM2 application
      ansible.builtin.command:
        cmd: pm2 describe {{ app_name }}
      become_user: ec2-user
      register: pm2_status
      failed_when: false
      changed_when: false

    - name: Start application with PM2
      ansible.builtin.command:
        cmd: pm2 start app.js --name {{ app_name }}
        chdir: "{{ app_directory }}"
      become_user: ec2-user
      when: pm2_status.rc != 0

    - name: Save PM2 configuration
      ansible.builtin.command:
        cmd: pm2 save
      become_user: ec2-user
      changed_when: true

    - name: Configure Nginx
      ansible.builtin.copy:
        dest: /etc/nginx/conf.d/nodejs.conf
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:3000;

                  proxy_http_version 1.1;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Restart Nginx

    - name: Enable and start Nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: Wait for Node.js application
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/health
        status_code: 200
      register: health
      retries: 5
      delay: 3
      until: health.status == 200

  handlers:

    - name: Restart application
      ansible.builtin.command:
        cmd: pm2 restart {{ app_name }}
      become_user: ec2-user
      failed_when: false

    - name: Restart Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted